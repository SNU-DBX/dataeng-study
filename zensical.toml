[project]
site_url = "https://snu-dbx.github.io/dataeng-study/"
site_name = "Data Engineering — Study Guides"
site_description = "Study guides for Data Engineering course"
site_author = "SNU DBX LAB"

copyright = "Copyright &copy; 2026 SNU DBX LAB"

repo_url = "https://github.com/SNU-DBX/dataeng-study"
repo_name = "SNU-DBX/dataeng-study"
# edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "PA0 · Bootcamp" = [
    "pa0/index.md",
    { "I · C Basics" = [
      "pa0/00-development-environment-and-tools.md",
      "pa0/01-c-program-structure-and-compilation.md",
      "pa0/02-data-types-and-control-flow.md",
      "pa0/03-functions-and-scope.md",
      "pa0/04-arrays-and-pointers.md",
      "pa0/05-dynamic-memory-management.md",
      "pa0/06-structures-and-user-defined-types.md",
      "pa0/07-build-and-debugging.md",
    ] },
    { "II · C++ Basics" = [
      "pa0/08-cpp-basic-syntax-and-type-system.md",
      "pa0/09-classes-inheritance-and-polymorphism.md",
      "pa0/10-stl.md",
      "pa0/11-resource-management-and-concurrency.md",
    ] },
    { "III · System Programming" = [
      "pa0/12-data-representation.md",
      "pa0/13-memory.md",
      "pa0/14-cache.md",
      "pa0/15-process-thread.md",
      "pa0/16-address-space.md", 
      "pa0/17-dynamic-alloc.md",
      "pa0/18-concurrency.md" 
    ] },
  ] },
]

extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

[project.extra]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = {
  permalink = true
}
pymdownx.arithmatex = {
  generic = true
}
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji = {
  emoji_generator = "zensical.extensions.emoji.to_svg",
  emoji_index = "zensical.extensions.emoji.twemoji",
}
pymdownx.highlight = {
  anchor_linenums = true,
  line_spans = "__span",
  pygments_lang_class = true,
}
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets = {
#   base_path = "includes",
# }
pymdownx.superfences = {
  custom_fences = [
    {
      name = "mermaid",
      class = "mermaid",
      format = "pymdownx.superfences.fence_code_format",
    },
  ],
}
pymdownx.tabbed = {
  alternate_style = true,
  combine_header_slug = true
}
pymdownx.tasklist = {
  custom_checkbox = true
}
pymdownx.tilde = {}
